name: Android Mobile Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-mobile.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Apply mobile repository adapter
        run: npm run mobile:apply-adapter

      - name: Typecheck
        run: npm run typecheck

      - name: Add Android project when absent
        run: test -d android || npx cap add android

      - name: Sync Android
        run: npm run mobile:sync:android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budget-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

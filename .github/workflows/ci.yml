name: CI

on:
  push:
    branches: ["master", "main", "epic-8"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: ["master", "main", "epic-8"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Electron desktop E2E jobs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-checks:
    name: Typecheck and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: true
      DATABASE_URL: file:./prisma/ci-${{ matrix.os }}.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: fast-checks
    timeout-minutes: 15
    env:
      CI: true
      DATABASE_URL: file:./prisma/coverage-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run coverage
        run: >-
          npm run test:coverage --
          --coverage.reporter=text
          --coverage.reporter=text-summary
          --coverage.reporter=html
          --coverage.reporter=json-summary
          --coverage.reporter=lcov

      - name: Upload coverage HTML report
        if: ${{ always() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  release-readiness:
    name: Release readiness checks
    runs-on: ubuntu-latest
    needs: fast-checks
    timeout-minutes: 20
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        github.event_name == 'push'
      }}
    env:
      CI: true
      DATABASE_URL: file:./prisma/release-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release check
        run: npm run release:check

  desktop-e2e:
    name: Electron E2E smoke tests
    runs-on: ubuntu-latest
    needs: release-readiness
    timeout-minutes: 25
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_e2e == 'true')
      }}
    env:
      CI: true
      DATABASE_URL: file:./prisma/e2e-ci.db
      ELECTRON_DISABLE_SECURITY_WARNINGS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install desktop E2E system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libxss1 libasound2 libgtk-3-0 libgbm1 libxshmfence1

      - name: Run desktop E2E smoke tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p e2e-artifacts
          xvfb-run --auto-servernum npm run test:e2e 2>&1 | tee e2e-artifacts/e2e-ubuntu.log

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-diagnostics
          path: |
            e2e-artifacts/**
            src/test/e2e/artifacts/**
          if-no-files-found: ignore
          retention-days: 14
